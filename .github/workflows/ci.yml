name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Формат, линтер, типы, тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check
      # Сгенерированные шкалы обязаны совпадать с рецептом: правка руками не пройдёт.
      - run: make tokens && git diff --exit-code src/shared/theme/palette.gen.ts
      # Формат, линтер и типы не видят битый импорт в ленивой ветке и упавший
      # config-плагин. Бандлинг видит — и стоит секунды.
      - name: Бандл собирается
        run: npx expo export --platform ios --platform android --output-dir /tmp/export
